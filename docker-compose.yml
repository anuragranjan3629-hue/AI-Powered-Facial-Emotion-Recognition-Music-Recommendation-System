version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EMOTION_ENGINE=auto
    restart: unless-stopped

  # Optional Python AI Microservice container
  python-ai-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - EMOTION_ENGINE=auto
      - FRONTEND_URL=http://localhost:3000
    profiles:
      - full-stack-ai
